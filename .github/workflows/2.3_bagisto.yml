name: Build and deploy Bagisto to Azure Web App

on:
  push:
    branches:
      - 2.3  # ou a branch que você usa
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔄 Checkout código
        uses: actions/checkout@v4

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, curl, zip, pdo, pdo_mysql
          tools: composer

      - name: 📦 Instalar dependências
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev
          php artisan config:cache

      - name: ⚙️ Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          npm install
          npm run build

      - name: 📁 Upload artifact para deploy
        uses: actions/upload-artifact@v4
        with:
          name: bagisto-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bagisto-app

      - name: 🔐 Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy para Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bagisto'
          slot-name: 'Production'
          package: .
